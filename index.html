<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>User Registration</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="wrapper" role="main">
    <section class="card" aria-labelledby="createHeading">
      <header>
        <h1 id="createHeading">Create Account</h1>
        <p class="subtitle">Please fill in the details below</p>
      </header>

      <form id="registerForm" novalidate>
        <div class="field">
          <label for="username">Username</label>
          <input type="text" id="username" name="username" required aria-describedby="userError">
          <span class="error" id="userError" role="alert" aria-live="polite"></span>
        </div>

        <div class="field">
          <label for="email">Email Address</label>
          <input type="email" id="email" name="email" required aria-describedby="emailError">
          <span class="error" id="emailError" role="alert" aria-live="polite"></span>
        </div>

        <div class="field">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" required aria-describedby="passError">
          <span class="error" id="passError" role="alert" aria-live="polite"></span>
        </div>

        <div class="actions">
          <button type="submit" class="btn">Register</button>
        </div>
      </form>

      <div class="success" id="successMsg" role="status" aria-live="polite"></div>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
